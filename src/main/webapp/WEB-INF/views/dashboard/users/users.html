<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление пользователями</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 30px;
        }

        header h1 { margin: 0; }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .navigation { margin-bottom: 20px; }

        .button {
            display: inline-block;
            padding: 9px 13px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover { background: #555; }

        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            padding: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th { background: #eee; }

        tbody tr:hover { background: #fafafa; }

        .status-active {
            color: #18783b;
            font-weight: bold;
        }

        .status-inactive {
            color: #b42318;
            font-weight: bold;
        }

        .empty {
            padding: 30px;
            background: white;
            border-radius: 8px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header { padding: 18px 20px; }
            th, td { padding: 8px; }
        }
    </style>
</head>
<body>
<header>
    <h1>Управление пользователями</h1>
</header>

<div class="container">
    <div class="navigation">
        <a class="button" th:href="@{/dashboard}">
            Назад в панель управления
        </a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(users)}">
        <h2>Пользователи отсутствуют</h2>
    </div>

    <div class="table-wrapper" th:unless="${#lists.isEmpty(users)}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя пользователя</th>
                <th>Email</th>
                <th>Дата регистрации</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.registrationDate != null
                    ? #temporals.format(user.registrationDate, 'dd.MM.yyyy HH:mm')
                    : 'Не указана'}"></td>
                <td>
                    <span th:if="${user.active}"
                          class="status-active">Активен</span>
                    <span th:unless="${user.active}"
                          class="status-inactive">Неактивен</span>
                </td>
                <td>
                    <a class="button"
                       th:href="@{/dashboard/users/user-details/{id}(id=${user.id})}">
                        Подробнее
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
