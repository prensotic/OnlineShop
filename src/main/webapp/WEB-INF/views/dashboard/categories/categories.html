<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Категории</title>
</head>
<body>
<h1>Список категорий</h1>
<p>
    <a th:href="@{/dashboard/categories/new-category}">
        Добавить категорию
    </a>
</p>
<p th:if="${#lists.isEmpty(categories)}">
    Категории отсутствуют.
</p>
<table th:unless="${#lists.isEmpty(categories)}" border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="category : ${categories}">
        <td th:text="${category.id}"></td>
        <td th:text="${category.categoryName}"></td>
        <td>
            <a th:href="@{/dashboard/categories/{id}(id=${category.id})}">
                Подробнее
            </a>
            <a th:href="@{/dashboard/categories/edit-category/{id}(id=${category.id})}">
                Редактировать
            </a>
            <form th:action="@{/dashboard/categories/{id}(id=${category.id})}"
                  method="post">
                <input type="hidden" name="_method" value="DELETE">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
<p>
    <a th:href="@{/dashboard}">Назад в панель управления</a>
</p>
</body>
</html>
