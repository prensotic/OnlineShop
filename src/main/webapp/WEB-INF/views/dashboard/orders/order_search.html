<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Результаты поиска заказов</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 30px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover {
            background: #555;
        }

        .card {
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            background: #fff0f0;
            color: #a32121;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #777;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eee;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            background: #eee;
            border-radius: 5px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            th, td {
                padding: 8px;
            }

            .card {
                padding: 15px;
            }
        }

        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-form input {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .search-form button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            cursor: pointer;
        }

        .search-form button:hover {
            background: #555;
        }
    </style>
</head>

<body>
<header>
    <h1>Результаты поиска заказов</h1>
</header>

<div class="container">
    <div class="navigation">
        <a class="button" th:href="@{/dashboard}">
            Панель управления
        </a>

        <section class="search-section">
            <h2>Поиск заказов пользователя</h2>

            <form th:action="@{/dashboard/orders/search}"
                  method="get"
                  class="search-form">

                <input type="text"
                       name="username"
                       placeholder="Введите имя пользователя"
                       minlength="1"
                       maxlength="20"
                       required>

                <button type="submit">Найти заказы</button>
            </form>
        </section>
    </div>

    <section class="card">
        <h2>
            Пользователь:
            <span th:text="${searchedUsername} ?: 'Не указан'"></span>
        </h2>

        <div class="message" th:if="${error != null}"
             th:text="${error}">
        </div>

        <div th:if="${error == null}">
            <p th:if="${#lists.isEmpty(orders)}" class="empty">
                У этого пользователя пока нет заказов.
            </p>

            <div class="table-wrapper"
                 th:unless="${#lists.isEmpty(orders)}">

                <table>
                    <thead>
                    <tr>
                        <th>ID заказа</th>
                        <th>Дата оформления</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id}"></td>

                        <td th:text="${order.createdAt != null
                            ? #temporals.format(order.createdAt, 'dd.MM.yyyy HH:mm')
                            : 'Не указана'}">
                        </td>

                        <td th:text="${order.amount}"></td>

                        <td>
                            <span class="status"
                                  th:text="${order.status}">
                            </span>
                        </td> <td>
                        <a class="button" th:href="@{/dashboard/orders/order-details/{id}(id=${order.id})}">
                            Просмотреть детали
                        </a>
                    </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</div>
</body>
</html>
