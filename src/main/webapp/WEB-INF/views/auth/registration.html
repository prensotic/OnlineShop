<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <h1>Online Shop</h1>
        <h2>Регистрация</h2>
        <form
                th:action="@{/auth/registration}"
                th:object="${user}"
                method="post">
            <div class="form-group">
                <label for="username">
                    Имя пользователя
                </label>
                <input type="text" id="username" th:field="*{username}" placeholder="Введите имя пользователя" required>
            </div>
            <div class="form-group">
                <label for="email">
                    Email
                </label>
                <input type="email" id="email" th:field="*{email}" placeholder="Введите email" required>
            </div>
            <div class="form-group">
                <label for="password">
                    Пароль
                </label>
                <input type="password" id="password" th:field="*{password}" placeholder="Введите пароль" required>
            </div>
            <button type="submit">
                Зарегистрироваться
            </button>
        </form>
        <div class="auth-footer">
            Уже есть аккаунт?
            <a th:href="@{/auth/login}">
                Войти
            </a>
        </div>
    </div>
</div>
</body>
</html>
